kind = "web"
previewPath = "/"
title = "Journal Index Platform"
description = "A scholarly journal discovery and indexing platform inspired by Scopus and Web of Science, with public journal metrics, publisher submissions, and editorial review workflows."
version = "1.0.0"
id = "artifacts/journal-index-platform"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18785

[services.development]
run = "pnpm --filter @workspace/journal-index-platform run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/journal-index-platform", "run", "build" ]
serve = "static"
publicDir = "artifacts/journal-index-platform/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18785"
BASE_PATH = "/"
